name: Feature request
description: Suggest an idea for Yok-AI
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How should it work for the user?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you considered
